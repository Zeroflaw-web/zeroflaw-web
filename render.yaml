services:
  - type: web
    name: zeroflaw-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8555

  - type: web
    name: zeroflaw-mcp
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    dockerCommand: python mcp_server.py --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
