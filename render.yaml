services:
  - type: web
    name: zeroflaw-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8555
      - key: CODEQL_ENABLED
        value: "true"
      - key: ZAP_ENABLED
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET
        value: zeroflaw-scans

cronjobs:
  - name: keep-alive
    schedule: "*/15 * * * *"
    command: "curl -sf https://zeroflaw-web.onrender.com/health || true"
    regions:
      - oregon
